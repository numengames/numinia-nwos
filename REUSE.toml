version = 1

# Regime map per Numinia canon C-005 v1.3.0, signed off by Oráculo on
# 2026-08-16 after the CC0 incident recorded in LEGAL_DEBT.md: versions
# published through commit 0157be9 were offered under the root CC0-1.0
# license (irrevocable, not revoked); from this commit forward the paths
# below carry their C-005 regime.
#
# Ordering matters: when several annotations match a file, the LAST one in
# this file wins. Specific overrides therefore come after their directory.

# --- Lore, narrative, brand, agent identity → reserved (C-005 §2) --------
[[annotations]]
path = ["canon/**", "guilds/**", "agents/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# Governance documents living inside canon/ are docs, not lore.
[[annotations]]
path = ["canon/C-005-licensing.md", "canon/INDEX.md", "canon/README.md"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC-BY-4.0"

# --- Documentation, ADRs, specs, missions, reports → CC-BY-4.0 -----------
[[annotations]]
path = [
  "decisions/**", "protocols/**", "operations/**", "reports/**",
  "missions/**", "blueprints/**", "standards/**",
  "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "GOVERNANCE.md",
  "STANDARDS.md", "CLAUDE.md", "TRADEMARKS.md", "LEGAL_DEBT.md",
  "GAPS.md", "SECURITY.md",
]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC-BY-4.0"

# Enforceable legal texts of the company are not documentation: C-005 is
# silent on their regime, so they stay in the birth regime (§1, reserved).
# This annotation comes after the docs block so it wins over operations/**.
[[annotations]]
path = "operations/legal/**"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# Commercial strategy is born closed (C-005 §1) — MIS-071 phase 2,
# Oracle-delegated regime decision 2026-08-17.
[[annotations]]
path = "operations/strategy/**"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# The Design System master declares CC0 itself (its frontmatter: "CC0 1.0
# Universal · marcas excluidas") and the design system is CC0 by prior
# canon (numinia-web REUSE, khepri/**). Not a new CC0 grant — preserving
# the document's birth regime. After the docs block so it wins.
[[annotations]]
path = "standards/2026_08_18-Sistema_de_Diseno-v5.0.0.md"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# --- Repo metadata → CC0-1.0 ---------------------------------------------
# (.github workflow/template files carry their own SPDX headers;
# CODEOWNERS cannot, so it is declared here.)
[[annotations]]
path = [".gitignore", ".github/CODEOWNERS"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# --- Code: viewer and scripts → MIT (C-005 §2: borde) --------------------
[[annotations]]
path = ["web/**", "scripts/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "MIT"
