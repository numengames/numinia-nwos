version = 1

# Regime map per Numinia canon C-005 v1.3.0, signed off by Oráculo on
# 2026-08-16 after the CC0 incident recorded in LEGAL_DEBT.md: versions
# published through commit 0157be9 were offered under the root CC0-1.0
# license (irrevocable, not revoked); from this commit forward the paths
# below carry their C-005 regime.
#
# Ordering matters: when several annotations match a file, the LAST one in
# this file wins. Specific overrides therefore come after their directory.

# --- Lore, narrative, brand → reserved (CAN-005 §2) ----------------------
# agents/** left this annotation on 2026-08-28 (ADR-026): an agent's
# operational definition is documentation, not lore, and CC0 was already
# granted over agents/ through commit 0157be9 (LEGAL_DEBT.md LD-001) —
# irrevocably. The reserved annotation declared a regime the repository did
# not have.
#
# canon/** left it on 2026-09-01 (ADR-036) for the same reason, verified
# rather than assumed: all seven canon documents were first published in
# f765b99 (2026-04-07), four months before the 2026-08-16 reservation, under
# the root CC0-1.0 LICENSE that was in force from 9f51ad1 until 2efd546.
# `git merge-base --is-ancestor f765b99 0157be9` confirms they precede the
# cut. The grant is irrevocable, so the reservation never took effect on
# them; keeping it would have been the second time this repository declared
# a regime it did not have.
[[annotations]]
path = ["guilds/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# --- Canon corpus → CC0-1.0 (ADR-036, pre-cut publication) ---------------
[[annotations]]
path = ["canon/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# --- Agent definitions → CC0-1.0 (ADR-026) -------------------------------
[[annotations]]
path = ["agents/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# The CC-BY-4.0 override that used to sit here — for CAN-005, INDEX.md and
# README.md, "governance documents living inside canon/ are docs, not lore" —
# was removed by ADR-036 (2026-09-01). It existed to carve the non-lore files
# out of a reserved folder; with canon/** now CC0-1.0 there is nothing to
# carve out, and two of its three paths were retired in the same change.
# CAN-005 follows the folder like every other canon document.

# --- Documentation, ADRs, specs, missions, reports → CC-BY-4.0 -----------
[[annotations]]
path = [
  "decisions/**", "operations/**", "reports/**",
  "missions/**", "debt/**",
  "README.md", "CHANGELOG.md", "CONTRIBUTING.md",
  "CLAUDE.md", "TRADEMARKS.md", "LEGAL_DEBT.md",
  "GAPS.md", "DEUDA-404.md", "SECURITY.md",
]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC-BY-4.0"

# --- Blueprints and protocols → CC0-1.0 (MIS-127, Oráculo decision) ------
# Blueprints are public domain. The CC-BY-4.0 label they carried was applied
# mechanically by 0157be9 (2026-08-16), which swept the whole documentation
# block into one annotation; it was never a decision about this folder.
# BLU-001..BLU-004 were published in April 2026 under the root CC0-1.0
# LICENSE, so for those the waiver was already made and is irrevocable
# (C-005: "CC0, published | None. The waiver is irrevocable").
# protocols/ joins on the same reasoning (Oracle, 2026-08-31): they describe
# how work is done, carry no reserved lore, and attribution on an operating
# procedure buys nothing. P-001..P-005 were likewise published in April 2026
# under the root CC0-1.0 LICENSE, so that waiver is irrevocable too.
# After the docs block so it wins.
[[annotations]]
path = ["blueprints/**", "protocols/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# system/ and history/ (ADR-035, MIS-129) inherit CC0-1.0 from blueprints/,
# where every one of their documents was published before the move. C-005
# holds a published CC0 waiver irrevocable: the shelf changed, the licence
# cannot. New documents born on these shelves are CC0 too, by this annotation.
[[annotations]]
path = ["system/**", "history/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# The Wardley map moved from blueprints/ to reports/ (ADR-035, MIS-129),
# crossing from the CC0-1.0 regime into reports/'s CC-BY-4.0. C-005 holds a
# published CC0 waiver irrevocable, so the file keeps CC0 on its new shelf.
[[annotations]]
path = "reports/RPT-2026-04-07-wardley-map.md"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# standards/ is CC0-1.0, on the same C-005 reasoning as blueprints/ and
# protocols/ above, and for three of its documents it is not a new grant but
# a fact already on the record. STANDARDS.md, governance.md and the Platform
# Role System were all born on 2026-04-06/07 and sat in the tree while the
# root LICENSE was CC0-1.0 (verified: the first commit of each is an ancestor
# of 0157be9, the CC0 cut). C-005 holds a published CC0 waiver irrevocable, so
# those copies are CC0 wherever they now live. The rest of the shelf joins
# them: a standard that obliges the whole corpus is of no use behind a licence.
# After the docs block so it wins.
[[annotations]]
path = ["standards/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# The rank system is Numinia's, not a platform convention: NOMAD, CITIZEN,
# PILGRIM, VERNACULAR, ARCHON and ORACLE are the domain model's own names, and
# promotion is tied to Session Zero, guilds and factions — reserved canon. It
# left canon/ on a genre ruling (ADR-023) and keeps its birth regime: CC-BY is
# irrevocable and would let anyone adapt Numinia's ranks. Oracle, 2026-08-25.
#
# NOTE, 2026-08-31 (MIS-127): this reservation may already be moot. The file
# was born 2026-04-07 as canon/Platform Role System.md and was in the tree at
# 0157be9 under the root CC0 LICENSE — by the same test applied above, a CC0
# copy is already published and cannot be withdrawn. Left reserved pending the
# Oracle's call: flagged rather than changed, because narrowing a licence is
# his decision and widening one is irreversible.
# After standards/** so it wins.
[[annotations]]
path = "standards/STD-003-platform-role-system.md"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# Enforceable legal texts of the company are not documentation: C-005 is
# silent on their regime, so they stay in the birth regime (§1, reserved).
# This annotation comes after the docs block so it wins over operations/**.
[[annotations]]
path = "operations/legal/**"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# Commercial strategy is born closed (C-005 §1) — MIS-071 phase 2,
# Oracle-delegated regime decision 2026-08-17.
[[annotations]]
path = "operations/strategy/**"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# The Design System master declares CC0 itself (its frontmatter: "CC0 1.0
# Universal · marcas excluidas") and the design system is CC0 by prior
# canon (numinia-web REUSE, khepri/**). Not a new CC0 grant — preserving
# the document's birth regime. After the docs block so it wins.
[[annotations]]
path = "standards/*Sistema_de_Diseno*.md"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# The living guide of the Design System, served verbatim at /diseno —
# a pinned generated artifact of the CC0 system (never edited here).
[[annotations]]
path = "web/public/diseno/**"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# Third-party: the house Phosphor icon subset (§7.3), self-hosted SVGs.
[[annotations]]
path = "web/src/icons/**"
SPDX-FileCopyrightText = "Phosphor Icons (https://phosphoricons.com)"
SPDX-License-Identifier = "MIT"

# Third-party fonts self-hosted by the guide: Geist (Vercel/basement.
# studio), Alegreya (Huerta Tipográfica), Pixelify Sans.
[[annotations]]
path = "web/public/diseno/assets/fonts/**"
SPDX-FileCopyrightText = [
  "2023 Vercel, in collaboration with basement.studio",
  "2011 The Alegreya Project Authors (https://github.com/huertatipografica/Alegreya)",
  "2021 The Pixelify Sans Project Authors",
]
SPDX-License-Identifier = "OFL-1.1"

# --- Repo metadata → CC0-1.0 ---------------------------------------------
# (.github workflow/template files carry their own SPDX headers;
# CODEOWNERS cannot, so it is declared here.)
[[annotations]]
path = [".gitignore", ".github/CODEOWNERS"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# --- Code and declared configuration → MIT (C-005 §2: borde) -------------
# infra/** holds declarative exports of platform configuration (GitHub
# rulesets today, Terraform when it exists). It is configuration, not corpus:
# same regime as the code that consumes it. Regime assigned 2026-08-25, when
# the licence guard refused the folder's first commit.
[[annotations]]
path = ["web/**", "scripts/**", "infra/**"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "MIT"
