# Declarative deploy config for the Numinia viewer on Cloudflare Workers.
# Replaces manual dashboard setup — no dashboard-only configuration.
# Deploy from web/: npx wrangler deploy
#
# NOTE: this is a NEW worker, deliberately not reusing the existing
# `numinia-web` worker (nwos-web.pablofm.workers.dev), which may still
# be the only host of the NWOS product (/velo, /api/registro).
name = "numinia-org"
compatibility_date = "2026-08-16"

# Fully static site: no `main` worker script, just static assets.
# Directory matches Astro's build output (`npm run build` → dist/).
[assets]
directory = "./dist"
